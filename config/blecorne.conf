CONFIG_ZMK_KEYBOARD_NAME="Blecorne"

# Set sleep timeout to 10min (10*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Enable Soft Off (allows turning off via key, wake via Reset)
CONFIG_ZMK_PM_SOFT_OFF=y

# Boost Bluetooth TX power, also make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Let a host that "forgot" the keyboard re-pair without needing &bt BT_CLR first.
# _SEC implies BT_SMP_ALLOW_UNAUTH_OVERWRITE, which is what Zephyr's
# update_keys_check() tests before refusing to overwrite an existing bond
# (SMP Pairing Failed reason=3 / BT_SMP_ERR_AUTH_REQUIREMENTS).
# Passkey entry stays off on purpose: it would mark bonds AUTHENTICATED, and
# Zephyr rejects overwriting an authenticated bond with Just Works regardless of
# the overwrite flag; it also forces re-pairing every currently paired host.
# Tradeoff: a peer that spoofs the bonded host address can re-pair on the active
# profile (ZMK still rejects other addresses unless the profile is open).
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Improves compatibility with iPad
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# Uncomment the following line to enable USB Logging (this increases power usage
# by a significant amount, turn it off when not in use)
#CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_STUDIO=y
